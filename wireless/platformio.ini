; Firmware of the wireless buzzer: an Adafruit ESP32 Feather V2 on a battery, see README.md

[platformio]
default_envs = feather

[env]
lib_deps =
    bblanchon/ArduinoJson@7.4.2

[env:feather]
platform = platformio/espressif32@7.1.3
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall

; the logic in lib/buzzer_core, tested on this computer: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
